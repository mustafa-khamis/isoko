<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Core SEO -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>RwanMart | Buy & Sell Online in Rwanda</title>

    <meta
      name="description"
      content="RwanMart is Rwanda's online marketplace to buy and sell products locally. Discover phones, electronics, cars, property, fashion, home items and more from sellers across Rwanda."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="bingbot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <meta name="theme-color" content="#16A34A" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://www.rwanmart.com/"
    />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!--
      Language / International SEO
      RwanMart currently serves English content.
      Add hreflang URLs only when dedicated localized URLs
      actually exist.
    -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="RwanMart | Buy & Sell Online in Rwanda"
    />

    <meta
      property="og:description"
      content="Buy and sell products across Rwanda on RwanMart. Discover local sellers, find great deals and list your products for buyers anywhere in Rwanda."
    />

    <meta
      property="og:url"
      content="https://www.rwanmart.com/"
    />

    <meta
      property="og:site_name"
      content="RwanMart"
    />

    <meta
      property="og:locale"
      content="en_RW"
    />

    <meta
      property="og:locale:alternate"
      content="rw_RW"
    />

    <!--
      Add this when a permanent public OG image exists:
      
      <meta
        property="og:image"
        content="https://www.rwanmart.com/og-image.jpg"
      />
      <meta
        property="og:image:width"
        content="1200"
      />
      <meta
        property="og:image:height"
        content="630"
      />
      <meta
        property="og:image:alt"
        content="RwanMart online marketplace in Rwanda"
      />
    -->

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="RwanMart | Buy & Sell Online in Rwanda"
    />

    <meta
      name="twitter:description"
      content="Buy and sell products across Rwanda on RwanMart. Discover local sellers, find products and list your own items for sale."
    />

    <!--
      Add when a permanent public social image exists:

      <meta
        name="twitter:image"
        content="https://www.rwanmart.com/og-image.jpg"
      />

      <meta
        name="twitter:image:alt"
        content="RwanMart online marketplace in Rwanda"
      />
    -->

    <!-- Google Identity Services -->
    <script
      src="https://accounts.google.com/gsi/client"
      async
      defer
    ></script>

    <!--
      ============================================================
      STRUCTURED DATA
      ============================================================
    -->
     <!-- Google analytics -->
      
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q86VQLK39V"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Q86VQLK39V');
    </script>
    <!-- WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.rwanmart.com/#website",
        "name": "RwanMart",
        "alternateName": [
          "RwanMart Rwanda",
          "RwanMart Marketplace"
        ],
        "url": "https://www.rwanmart.com/",
        "description": "RwanMart is an online marketplace in Rwanda where people can buy and sell products and discover local sellers.",
        "inLanguage": "en-RW",
        "publisher": {
          "@id": "https://www.rwanmart.com/#organization"
        }
      }
    </script>

    <!-- Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.rwanmart.com/#organization",
        "name": "RwanMart",
        "url": "https://www.rwanmart.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.rwanmart.com/favicon.png"
        },
        "description": "RwanMart is an online marketplace in Rwanda that connects buyers and sellers and makes it easy to buy and sell products locally.",
        "areaServed": {
          "@type": "Country",
          "name": "Rwanda"
        }
      }
    </script>

    <!-- WebPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "@id": "https://www.rwanmart.com/#webpage",
        "url": "https://www.rwanmart.com/",
        "name": "RwanMart | Buy & Sell Online in Rwanda",
        "description": "RwanMart is Rwanda's online marketplace to buy and sell products locally. Discover products from sellers across Rwanda or list your own items for sale.",
        "isPartOf": {
          "@id": "https://www.rwanmart.com/#website"
        },
        "about": {
          "@id": "https://www.rwanmart.com/#organization"
        },
        "inLanguage": "en-RW"
      }
    </script>

    <!--
      ============================================================
      NOTE FOR THE DEVELOPMENT TEAM
      ============================================================

      The homepage metadata above is only the foundation.

      Every indexable marketplace page should have its own:

      - <title>
      - meta description
      - canonical URL
      - Open Graph metadata
      - relevant structured data
      - unique visible content

      Product pages should use Product + Offer structured data.

      Category pages should use CollectionPage / ItemList where
      appropriate.

      Search/filter URLs should generally NOT be indexed unless
      they represent valuable, permanent landing pages.

      Example:

      /product/iphone-15-pro-max
      /category/mobile-phones
      /category/cars
      /category/property
      /location/kigali
      /location/kigali/mobile-phones

      These pages should NOT all share the homepage metadata.
    -->
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
